<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>AR Sthanam</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #ar-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      /* MindAR's <video> element uses z-index:-2 relative to this
         container. Without isolation, that negative z-index falls through
         to behind the page's own background instead of just behind the
         3D canvas, hiding the camera feed entirely. */
      isolation: isolate;
    }
    #status {
      position: fixed;
      left: 50%;
      bottom: 32px;
      transform: translateX(-50%);
      color: #fff;
      background: rgba(0, 0, 0, 0.55);
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 15px;
      text-align: center;
      pointer-events: none;
      z-index: 10;
      transition: opacity 0.2s ease;
    }
    #status:empty {
      opacity: 0;
    }
  </style>
</head>
<body>
  <div id="ar-container"></div>
  <div id="status">Loading…</div>

  <script src="./config.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="./app.js"></script>
</body>
</html>
