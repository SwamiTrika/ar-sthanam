<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>AR Sthanam</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
    }
    #hint {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      color: #fff;
      background: rgba(0, 0, 0, 0.55);
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 14px;
      text-align: center;
      pointer-events: none;
      z-index: 10;
      max-width: 85vw;
    }
    #ar-button {
      background: #2e86de;
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 600;
      position: absolute;
      bottom: 96px;
      left: 50%;
      transform: translateX(-50%);
    }
  </style>
</head>
<body>
  <model-viewer
    id="viewer"
    src="./assets/model.glb"
    ios-src="./assets/model.usdz"
    ar
    ar-modes="quick-look scene-viewer webxr"
    ar-scale="fixed"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    alt="A 5 foot tall sthanam shrine"
  >
    <button id="ar-button" slot="ar-button">View in your space</button>
  </model-viewer>

  <div id="hint">
    Tap "View in your space", then point your camera at the printed card.
  </div>

  <script>
    const viewer = document.getElementById('viewer');
    viewer.addEventListener('ar-status', (event) => {
      // 'not-presenting' | 'session-started' | 'object-placed' | 'failed'
      console.log('ar-status:', event.detail.status);
    });
  </script>
</body>
</html>
